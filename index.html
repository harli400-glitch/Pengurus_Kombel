          ]
        };

        const TOTAL_EXPECTED_KOMBEL = Object.values(NAMA_KOMBEL_MAPPING).reduce((sum, arr) => sum + arr.length, 0); 
        const TOTAL_EXPECTED_PENGURUS = Object.values(TARGET_PENGURUS_KOMBEL).reduce((sum, val) => sum + val, 0); 

        // Konfigurasi Firebase Anda
        const firebaseConfig = {
          apiKey: "AIzaSyB3N4uaAILOTFZG6BoeotXGMxNKfpxf6oo",
          authDomain: "pengurus-kombel.firebaseapp.com",
          projectId: "pengurus-kombel",
          storageBucket: "pengurus-kombel.firebasestorage.app",
          messagingSenderId: "1026260658552",
          appId: "1:1026260658552:web:88fe94588bdcc1c4eb408d",
          measurementId: "G-G6FZYS8153"
        };

        const isLocalMode = firebaseConfig.apiKey === "ISI_API_KEY_ANDA" || !firebaseConfig.apiKey;

        let app, db, auth;
        try {
            if (!isLocalMode) {
                app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);
            }
        } catch (e) {
            console.error("Gagal menginisialisasi Firebase. Pastikan konfigurasi valid:", e);
        }

        const appId = 'kombel-app';

        function App() {
          const [activeTab, setActiveTab] = useState('dashboard');
          const [submissions, setSubmissions] = useState([]);
          const [loading, setLoading] = useState(true);
          const [submitting, setSubmitting] = useState(false);
          const [message, setMessage] = useState(null); 
          const [isReady, setIsReady] = useState(false);

          const [searchFilters, setSearchFilters] = useState({ kecamatan: '', jenisPengurus: '', namaKombel: '', statusSK: '' });
          const [detailModal, setDetailModal] = useState(null);
          const [uploadModal, setUploadModal] = useState(null);
          const [newSkLink, setNewSkLink] = useState('');

          const [formData, setFormData] = useState({
            kecamatan: '', jenisKombel: '', jenisPengurus: '', namaKombel: '',
            namaKetua: '', instansiKetua: '', noHpKetua: '',
            namaSekretaris: '', instansiSekretaris: '', noHpSekretaris: '',
            namaBendahara: '', instansiBendahara: '', noHpBendahara: '',
            namaWakilKetua: '', instansiWakilKetua: '', noHpWakilKetua: '',
            namaPendidikan: '', instansiPendidikan: '', noHpPendidikan: '',
            namaPerencanaan: '', instansiPerencanaan: '', noHpPerencanaan: '',
            namaHumas: '', instansiHumas: '', noHpHumas: '',
            namaDokumentasi: '', instansiDokumentasi: '', noHpDokumentasi: '',
            statusSK: 'sudah', linkSK: ''
          });

          useEffect(() => {
            if (isLocalMode) {
                setSubmissions([
                    {
                        id: 'mock-1',
                        kecamatan: 'Tobelo',
                        jenisKombel: 'Sekolah SD',
                        jenisPengurus: 'Pengurus Kombel Sekolah SD',
                        namaKombel: 'SD NEGERI 1 TOBELO',
                        namaKetua: 'Budi Santoso',
                        instansiKetua: 'SD NEGERI 1 TOBELO',
                        statusSK: 'sudah',
                        linkSK: 'https://example.com/sk-kombel-1',
                        timestamp: new Date()
                    },
                    {
                        id: 'mock-2',
                        kecamatan: 'Galela',
                        jenisKombel: 'Sekolah SMP',
                        jenisPengurus: 'Pengurus Kombel Sekolah SMP',
                        namaKombel: 'SMP KRISTEN GALELA',
                        namaKetua: 'Siti Aminah',
                        instansiKetua: 'SMP KRISTEN GALELA',
                        statusSK: 'belum',
                        linkSK: '',
                        timestamp: new Date()
                    }
                ]);
                setLoading(false);
                setIsReady(true);
                return;
            }

            if (!auth || !db) {
                setLoading(false);
                return;
            }

            const initFirebase = async () => {
                try {
                    await signInAnonymously(auth);
                } catch (error) {
                    console.error("Authentication error:", error);
                }
            };

            const unsubscribeAuth = onAuthStateChanged(auth, (user) => {
                if (user) {
                    setIsReady(true);
                    const dataQuery = query(collection(db, 'artifacts', appId, 'public', 'data', 'submissions'));
                    
                    const unsubscribeData = onSnapshot(dataQuery, (snapshot) => {
                        const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                        setSubmissions(data);
                        setLoading(false);
                    }, (error) => {
                        console.error("Error fetching data:", error);
                        setLoading(false);
                        setMessage({ type: 'error', text: 'Gagal memuat data dari server. Pastikan Database Anda terbuka.' });
                    });
                    
                    return () => unsubscribeData();
                } else {
                   if(!isReady) initFirebase();
                }
            });

            return () => unsubscribeAuth && unsubscribeAuth();
          }, [isReady]);

          const handleInputChange = (e) => {
            const { name, value } = e.target;
            setFormData(prev => {
              const newData = { ...prev, [name]: value };
              if (name === 'jenisKombel') newData.namaKombel = '';
              return newData;
            });
          };

          const handleSubmit = async (e) => {
            e.preventDefault();
            setMessage(null);
            setSubmitting(true);

            if (!formData.kecamatan || !formData.jenisKombel || !formData.namaKombel || !formData.jenisPengurus) {
                setMessage({ type: 'error', text: 'Kecamatan, Jenis Kombel, Jenis Pengurus, dan Nama Kombel wajib diisi!' });
                setSubmitting(false);
                return;
            }

            try {
                const dataToSave = { ...formData, timestamp: isLocalMode ? new Date() : serverTimestamp() };
                if (formData.statusSK === 'belum') dataToSave.linkSK = ''; 

                if (isLocalMode) {
                    const newSubmission = { id: `local-${Date.now()}`, ...dataToSave };
                    setSubmissions(prev => [...prev, newSubmission]);
                } else {
                    if (!auth.currentUser) throw new Error("Tidak ada akses otentikasi.");
                    await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'submissions'), dataToSave);
                }

                setMessage({ type: 'success', text: 'Data Kombel berhasil disimpan!' });
                setFormData({
                    kecamatan: '', jenisKombel: '', jenisPengurus: '', namaKombel: '',
                    namaKetua: '', instansiKetua: '', noHpKetua: '',
                    namaSekretaris: '', instansiSekretaris: '', noHpSekretaris: '',
                    namaBendahara: '', instansiBendahara: '', noHpBendahara: '',
                    namaWakilKetua: '', instansiWakilKetua: '', noHpWakilKetua: '',
                    namaPendidikan: '', instansiPendidikan: '', noHpPendidikan: '',
                    namaPerencanaan: '', instansiPerencanaan: '', noHpPerencanaan: '',
                    namaHumas: '', instansiHumas: '', noHpHumas: '',
                    namaDokumentasi: '', instansiDokumentasi: '', noHpDokumentasi: '',
                    statusSK: 'sudah', linkSK: ''
                });
                
                setTimeout(() => setActiveTab('data'), 2000);

            } catch (error) {
                console.error("Error submitting form:", error);
                setMessage({ type: 'error', text: 'Gagal menyimpan data. Silakan coba lagi. Pastikan akses tulis Database Firestore terbuka.' });
            } finally {
                setSubmitting(false);
            }
          };

          const handleUpdateSK = async (e) => {
            e.preventDefault();
            if (!newSkLink || !uploadModal) return;
            
            try {
                if (isLocalMode) {
                    setSubmissions(prev => prev.map(item => 
                        item.id === uploadModal.id ? { ...item, linkSK: newSkLink, statusSK: 'sudah' } : item
                    ));
                } else {
                    const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'submissions', uploadModal.id);
                    await updateDoc(docRef, { linkSK: newSkLink, statusSK: 'sudah' });
                }
                setUploadModal(null);
                setNewSkLink('');
            } catch (error) {
                console.error("Error updating SK:", error);
                setUploadModal(prev => ({ ...prev, error: "Gagal mengupdate SK. Coba periksa izin database Anda."}));
            }
          };

          // FUNGSI MENGHAPUS DATA DENGAN PASSWORD "siska"
          const handleDelete = async (id, namaKombel) => {
            const inputPassword = window.prompt(`Masukkan password untuk menghapus data "${namaKombel}":`);
            
            if (inputPassword === null) return; // Pengguna menekan tombol Batal

            if (inputPassword !== "siska") {
                alert("Password salah! Data tidak dapat dihapus.");
                return;
            }

            const isConfirm = window.confirm(`Apakah Anda yakin ingin menghapus data kombel "${namaKombel}"?`);
            if (!isConfirm) return;
            
            try {
                if (isLocalMode) {
                    setSubmissions(prev => prev.filter(item => item.id !== id));
                } else {
                    const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'submissions', id);
                    await deleteDoc(docRef);
                }
                alert("Data berhasil dihapus.");
            } catch (error) {
                console.error("Error menghapus data:", error);
                alert("Gagal menghapus data. Periksa aturan keamanan database Anda.");
            }
          };

          // FUNGSI DOWNLOAD EXCEL
          const handleDownloadExcel = (dataToExport) => {
            if (!dataToExport || dataToExport.length === 0) {
                alert("Tidak ada data untuk diunduh!");
                return;
            }

            const excelData = dataToExport.map((item, index) => ({
                "No": index + 1,
                "Kecamatan": item.kecamatan || '',
                "Jenis Kombel": item.jenisKombel || '',
                "Jenis Pengurus": item.jenisPengurus || '',
                "Nama Kombel": item.namaKombel || '',
                "Nama Ketua": item.namaKetua || '',
                "Instansi Ketua": item.instansiKetua || '',
                "No HP Ketua": item.noHpKetua || '',
                "Nama Wakil Ketua": item.namaWakilKetua || '',
                "Instansi Wakil Ketua": item.instansiWakilKetua || '',
                "No HP Wakil Ketua": item.noHpWakilKetua || '',
                "Nama Sekretaris": item.namaSekretaris || '',
                "Instansi Sekretaris": item.instansiSekretaris || '',
                "No HP Sekretaris": item.noHpSekretaris || '',
                "Nama Bendahara": item.namaBendahara || '',
                "Instansi Bendahara": item.instansiBendahara || '',
                "No HP Bendahara": item.noHpBendahara || '',
                "Bidang Pendidikan": item.namaPendidikan || '',
                "Instansi Pendidikan": item.instansiPendidikan || '',
                "No HP Pendidikan": item.noHpPendidikan || '',
                "Bidang Perencanaan": item.namaPerencanaan || '',
                "Instansi Perencanaan": item.instansiPerencanaan || '',
                "No HP Perencanaan": item.noHpPerencanaan || '',
                "Bidang Humas": item.namaHumas || '',
                "Instansi Humas": item.instansiHumas || '',
                "No HP Humas": item.noHpHumas || '',
                "Bidang Dokumentasi": item.namaDokumentasi || '',
                "Instansi Dokumentasi": item.instansiDokumentasi || '',
                "No HP Dokumentasi": item.noHpDokumentasi || '',
                "Status SK": item.linkSK ? 'Sudah Ada SK' : 'Belum Ada SK',
                "Link SK": item.linkSK || ''
            }));

            const worksheet = XLSX.utils.json_to_sheet(excelData);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Data Hasil Isian");
            XLSX.writeFile(workbook, `Data_Hasil_Isian_Kombel_${new Date().toISOString().slice(0, 10)}.xlsx`);
          };

          const stats = useMemo(() => {
            const totalSubmitted = submissions.length; 
            const totalSKUploaded = submissions.filter(s => s.linkSK && s.linkSK.trim() !== '').length;

            const uniqueKombelSet = new Set();
            submissions.forEach(s => {
                if (s.namaKombel) uniqueKombelSet.add(s.namaKombel);
            });
            const totalKombelUnik = uniqueKombelSet.size;

            const percentKombel = TOTAL_EXPECTED_KOMBEL > 0 ? ((totalKombelUnik / TOTAL_EXPECTED_KOMBEL) * 100).toFixed(1) : 0;
            const percentPengurus = TOTAL_EXPECTED_PENGURUS > 0 ? ((totalSubmitted / TOTAL_EXPECTED_PENGURUS) * 100).toFixed(1) : 0;
            const percentSK = totalSubmitted > 0 ? ((totalSKUploaded / totalSubmitted) * 100).toFixed(1) : 0;

            const byJenisPengurus = JENIS_PENGURUS_KOMBEL.map(jenis => {
                const count = submissions.filter(s => s.jenisPengurus === jenis).length;
                const target = TARGET_PENGURUS_KOMBEL[jenis] || 0;
                return {
                    jenis, count, target,
                    percent: target > 0 ? ((count / target) * 100).toFixed(1) : 0
                };
            });

            return { totalSubmitted, totalKombelUnik, totalSKUploaded, percentKombel, percentPengurus, percentSK, byJenisPengurus };
          }, [submissions]);

                className={`${colorClass} h-3.5 rounded-full transition-all duration-1000 ease-in-out`} 
                style={{ width: `${Math.min(100, Math.max(0, percent))}%` }}
              ></div>
            </div>
          );

            const filteredData = submissions.filter(item => {
                const matchKec = item.kecamatan?.toLowerCase().includes(searchFilters.kecamatan.toLowerCase());
                const matchPengurus = item.jenisPengurus?.toLowerCase().includes(searchFilters.jenisPengurus.toLowerCase());
                const matchNama = item.namaKombel?.toLowerCase().includes(searchFilters.namaKombel.toLowerCase());
                
                let matchSK = true;
                if (searchFilters.statusSK === 'ada') matchSK = !!item.linkSK;
                else if (searchFilters.statusSK === 'belum') matchSK = !item.linkSK;

                return matchKec && matchPengurus && matchNama && matchSK;

                            <h2 className="text-lg font-semibold text-slate-800 flex items-center gap-2">
                                <Database className="w-5 h-5 text-indigo-500" />
                                Data Hasil Isian Responden
                            </h2>
                            {/* Tombol Download Excel */}
                            <button 
                                onClick={() => handleDownloadExcel(filteredData)}
                                className="inline-flex items-center justify-center gap-2 px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-sm font-medium transition-colors shadow-sm"
                            >
                                <Download className="w-4 h-4" />
                                Download Excel
                            </button>
                        </div>

                            </div>
                            <div className="relative">
                                <Search className="absolute left-3 top-2.5 h-4 w-4 text-slate-400" />
                                <input type="text" placeholder="Cari Jenis Pengurus..." value={searchFilters.jenisPengurus} onChange={(e) => setSearchFilters({...searchFilters, jenisPengurus: e.target.value})} className="pl-9 w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:border-indigo-500 focus:outline-none" />
                            </div>

                            </div>
                            <div className="relative">
                                <select 
                                    value={searchFilters.statusSK} 
                                    onChange={(e) => setSearchFilters({...searchFilters, statusSK: e.target.value})} 
                                    className="w-full rounded-md border border-slate-300 px-3 py-2 text-sm bg-white text-slate-600 focus:outline-none focus:border-indigo-500"
                                >
                                    <option value="">Semua Status SK</option>
                                    <option value="ada">Sudah Ada SK</option>
                                    <option value="belum">Belum Ada SK</option>
                                </select>
                            </div>
                        </div>

                        <div className="overflow-x-auto border border-slate-200 rounded-lg">
                            <table className="w-full text-sm text-left">
                                <thead className="text-xs text-slate-500 uppercase bg-slate-50 border-b border-slate-200">
                                    <tr>
                                        <th className="px-4 py-3 font-medium text-center w-12">No</th>
                                        <th className="px-4 py-3 font-medium">Kecamatan</th>
                                        <th className="px-4 py-3 font-medium">Jenis Pengurus</th>
                                        <th className="px-4 py-3 font-medium">Nama Kombel</th>
                                        <th className="px-4 py-3 font-medium text-center">SK</th>
                                        <th className="px-4 py-3 font-medium text-center">Upload SK / Detail / Hapus</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {filteredData.length === 0 ? (
                                        <tr><td colSpan="6" className="px-4 py-8 text-center text-slate-500">Belum ada data ditemukan</td></tr>
                                    ) : (
                                        filteredData.map((item, index) => (
                                            <tr key={item.id} className="border-b border-slate-100 hover:bg-slate-50">
                                                <td className="px-4 py-3 text-center text-slate-500 font-medium">{index + 1}</td>
                                                <td className="px-4 py-3">{item.kecamatan}</td>
                                                <td className="px-4 py-3">{item.jenisPengurus}</td>
                                                <td className="px-4 py-3 font-medium text-slate-800">{item.namaKombel}</td>
                                                <td className="px-4 py-3 text-center">
                                                    {item.linkSK ? (
                                                        <span className="inline-flex items-center px-2 py-1 rounded-full text-xs font-medium bg-emerald-100 text-emerald-800">Ada</span>
                                                    ) : (
                                                        <span className="inline-flex items-center px-2 py-1 rounded-full text-xs font-medium bg-amber-100 text-amber-800">Belum</span>
                                                    )}
                                                </td>
                                                <td className="px-4 py-3 text-center">
                                                    <div className="flex items-center justify-center gap-2">
                                                        {!item.linkSK && (
                                                            <button onClick={() => setUploadModal(item)} className="p-1.5 text-indigo-600 hover:bg-indigo-50 rounded-md" title="Upload Link SK">
                                                                <Upload className="w-4 h-4" />
                                                            </button>
                                                        )}
                                                        <button onClick={() => setDetailModal(item)} className="p-1.5 text-slate-600 hover:bg-slate-100 rounded-md" title="Lihat Detail">
                                                            <Eye className="w-4 h-4" />
                                                        </button>
                                                        {/* Tombol Hapus dengan Proteksi Password "siska" */}
                                                        <button onClick={() => handleDelete(item.id, item.namaKombel)} className="p-1.5 text-red-600 hover:bg-red-100 rounded-md" title="Hapus Data">
                                                            <Trash2 className="w-4 h-4" />
                                                        </button>
                                                    </div>
                                                </td>
                                            </tr>
                                        ))
                                    )}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    {uploadModal && (
                        <div className="fixed inset-0 bg-slate-900/50 flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-xl shadow-lg w-full max-w-md overflow-hidden animate-fadeIn">
                                <div className="flex items-center justify-between px-6 py-4 border-b border-slate-100">
                                    <h3 className="font-semibold text-slate-800">Upload Link SK</h3>
                                    <button onClick={() => setUploadModal(null)} className="text-slate-400 hover:text-slate-600"><X className="w-5 h-5"/></button>
                                </div>
                                <form onSubmit={handleUpdateSK} className="p-6">
                                    {uploadModal.error && (
                                        <div className="mb-4 p-3 bg-red-50 text-red-700 text-sm rounded-lg border border-red-200 flex items-start gap-2">
                                            <AlertCircle className="w-5 h-5 shrink-0" />
                                            <p>{uploadModal.error}</p>
                                        </div>
                                    )}
                                    <p className="text-sm text-slate-600 mb-4">Masukkan tautan (link) SK untuk <b>{uploadModal.namaKombel}</b>.</p>

                    {detailModal && (

                                    <div>

                                                <div className="flex border-b border-slate-100 pb-2"><div className="w-1/3 text-slate-500">Wakil Ketua</div><div className="w-2/3 font-medium">{detailModal.namaWakilKetua || '-'} <span className="text-slate-400 text-xs font-normal">({detailModal.instansiWakilKetua || '-'})</span></div></div>
                                            )}
                                            <div className="flex border-b border-slate-100 pb-2"><div className="w-1/3 text-slate-500">Sekretaris</div><div className="w-2/3 font-medium">{detailModal.namaSekretaris || '-'} <span className="text-slate-400 text-xs font-normal">({detailModal.instansiSekretaris || '-'})</span></div></div>
                                            <div className="flex border-b border-slate-100 pb-2"><div className="w-1/3 text-slate-500">Bendahara</div><div className="w-2/3 font-medium">{detailModal.namaBendahara || '-'} <span className="text-slate-400 text-xs font-normal">({detailModal.instansiBendahara || '-'})</span></div></div>

                                            <div className="space-y-3 text-sm">
                                                {detailModal.namaPendidikan && <div className="flex border-b border-slate-100 pb-2"><div className="w-1/3 text-slate-500">Pendidikan</div><div className="w-2/3 font-medium">{detailModal.namaPendidikan} <span className="text-slate-400 text-xs font-normal">({detailModal.instansiPendidikan})</span></div></div>}
                                                {detailModal.namaPerencanaan && <div className="flex border-b border-slate-100 pb-2"><div className="w-1/3 text-slate-500">Perencanaan</div><div className="w-2/3 font-medium">{detailModal.namaPerencanaan} <span className="text-slate-400 text-xs font-normal">({detailModal.instansiPerencanaan})</span></div></div>}
                                                {detailModal.namaHumas && <div className="flex border-b border-slate-100 pb-2"><div className="w-1/3 text-slate-500">Humas</div><div className="w-2/3 font-medium">{detailModal.namaHumas} <span className="text-slate-400 text-xs font-normal">({detailModal.instansiHumas})</span></div></div>}
                                                {detailModal.namaDokumentasi && <div className="flex border-b border-slate-100 pb-2"><div className="w-1/3 text-slate-500">Dokumentasi</div><div className="w-2/3 font-medium">{detailModal.namaDokumentasi} <span className="text-slate-400 text-xs font-normal">({detailModal.instansiDokumentasi})</span></div></div>}
                                            </div>
                                        </div>

            );
          };

          const renderDashboard = () => (
            <div className="space-y-6 animate-fadeIn">
              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                
                <div className="bg-white rounded-xl shadow-sm p-6 border border-slate-100">
                  <div className="flex items-center justify-between mb-4">
                    <h3 className="text-slate-500 font-medium text-xs uppercase tracking-wider">Total Data Kombel</h3>
                    <div className="p-2 bg-indigo-50 rounded-lg"><Users className="w-5 h-5 text-indigo-600"/></div>
                  </div>
                  <div className="flex items-end gap-2">
                    <span className="text-3xl font-bold text-slate-800">{stats.totalKombelUnik}</span>
                    <span className="text-slate-500 mb-1 text-xs">/ {TOTAL_EXPECTED_KOMBEL} Target</span>
                  </div>
                  <div className="mt-4">
                     <div className="flex justify-between text-xs mb-1">
                        <span className="font-medium text-indigo-700">Progres Kombel</span>
                        <span className="font-bold">{stats.percentKombel}%</span>
                     </div>
                     <ProgressBar percent={stats.percentKombel} colorClass="bg-indigo-600" />
                  </div>
                </div>

                <div className="bg-white rounded-xl shadow-sm p-6 border border-slate-100">
                  <div className="flex items-center justify-between mb-4">
                    <h3 className="text-slate-500 font-medium text-xs uppercase tracking-wider">Progres Pengurus Kombel</h3>
                    <div className="p-2 bg-purple-50 rounded-lg"><Briefcase className="w-5 h-5 text-purple-600"/></div>
                  </div>
                  <div className="flex items-end gap-2">
                    <span className="text-3xl font-bold text-slate-800">{stats.totalSubmitted}</span>
                    <span className="text-slate-500 mb-1 text-xs">/ {TOTAL_EXPECTED_PENGURUS} Target</span>
                  </div>
                  <div className="mt-4">
                     <div className="flex justify-between text-xs mb-1">
                        <span className="font-medium text-purple-700">Progres Pengisian</span>
                        <span className="font-bold">{stats.percentPengurus}%</span>
                     </div>
                     <ProgressBar percent={stats.percentPengurus} colorClass="bg-purple-500" />
                  </div>
                </div>

                <div className="bg-white rounded-xl shadow-sm p-6 border border-slate-100">
                  <div className="flex items-center justify-between mb-4">
                    <h3 className="text-slate-500 font-medium text-xs uppercase tracking-wider">Total SK Diunggah</h3>
                    <div className="p-2 bg-emerald-50 rounded-lg"><CheckCircle className="w-5 h-5 text-emerald-600"/></div>
                  </div>
                  <div className="flex items-end gap-2">
                    <span className="text-3xl font-bold text-slate-800">{stats.totalSKUploaded}</span>
                    <span className="text-slate-500 mb-1 text-xs">/ {stats.totalSubmitted} Form Masuk</span>
                  </div>
                  <div className="mt-4">
                     <div className="flex justify-between text-xs mb-1">
                        <span className="font-medium text-emerald-700">Persentase SK</span>
                        <span className="font-bold">{stats.percentSK}%</span>
                     </div>
                     <ProgressBar percent={stats.percentSK} colorClass="bg-emerald-500" />
                  </div>
                </div>

                <div className="bg-white rounded-xl shadow-sm p-6 border border-slate-100 flex flex-col justify-center items-center text-center">
                    <Activity className="w-10 h-10 text-blue-400 mb-3" />
                    <h3 className="text-slate-600 font-medium text-sm">Status Sistem</h3>
                    <p className="text-xl font-bold text-slate-800 mt-1">Aktif & Sinkron</p>
                    <p className="text-xs text-slate-400 mt-2">Data terakhir diperbarui real-time</p>
                </div>
              </div>

              <div className="bg-white rounded-xl shadow-sm border border-slate-100 overflow-hidden">
                <div className="px-6 py-4 border-b border-slate-100 bg-slate-50 flex items-center gap-2">
                    <BarChart className="w-5 h-5 text-slate-500" />
                    <h2 className="text-lg font-semibold text-slate-800">Rekapitulasi Berdasarkan Jenis Pengurus Kombel</h2>
                </div>
                <div className="overflow-x-auto">
                  <table className="w-full text-sm text-left">
                    <thead className="text-xs text-slate-500 uppercase bg-slate-50 border-b border-slate-200">
                      <tr>
                        <th className="px-6 py-4 font-medium">Jenis Pengurus Kombel</th>
                        <th className="px-6 py-4 font-medium text-center">Data Masuk</th>
                        <th className="px-6 py-4 font-medium text-center">Target (Basis Data)</th>
                        <th className="px-6 py-4 font-medium text-right">Persentase</th>
                      </tr>
                    </thead>
                    <tbody>
                      {stats.byJenisPengurus.map((item, idx) => (
                        <tr key={idx} className="border-b border-slate-100 hover:bg-slate-50/50 transition-colors">
                          <td className="px-6 py-4 font-medium text-slate-800">{item.jenis}</td>
                          <td className="px-6 py-4 text-center font-semibold text-indigo-600">{item.count}</td>
                          <td className="px-6 py-4 text-center text-slate-500">{item.target}</td>
                          <td className="px-6 py-4 text-right">
                            <span className={`inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium ${
                                Number(item.percent) >= 100 ? 'bg-emerald-100 text-emerald-800' :
                                Number(item.percent) >= 50 ? 'bg-blue-100 text-blue-800' :
                                'bg-amber-100 text-amber-800'
                            }`}>
                                {item.percent}%
                            </span>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          );

          const renderForm = () => (
            <div className="max-w-2xl mx-auto bg-white rounded-xl shadow-sm border border-slate-100 overflow-hidden animate-fadeIn">
              <div className="px-6 py-5 border-b border-slate-100 bg-indigo-50/50">

                    <div className={`p-4 mb-6 rounded-lg text-sm flex items-start gap-3 ${
                        message.type === 'success' ? 'bg-emerald-50 text-emerald-800 border border-emerald-200' : 'bg-red-50 text-red-800 border border-red-200'
                    }`}>
                        {message.type === 'success' ? <CheckCircle className="w-5 h-5 shrink-0" /> : <AlertCircle className="w-5 h-5 shrink-0" />}
                        <p className="mt-0.5">{message.text}</p>
                    </div>
                )}

                            <option value="">-- Pilih Jenis Pengurus Kombel --</option>
                            {JENIS_PENGURUS_KOMBEL.map(jenis => <option key={jenis} value={jenis}>{jenis}</option>)}
                        </select>

                    <div>
                        <label className="block text-sm font-medium text-slate-700 mb-1">

                        </label>
                        <select 
                            name="namaKombel" value={formData.namaKombel} onChange={handleInputChange} required disabled={!formData.jenisKombel}
                            className="w-full rounded-lg border border-slate-300 bg-white px-4 py-2.5 text-sm focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500 disabled:bg-slate-100 disabled:text-slate-400 transition-colors"

                            <option value="">
                                {!formData.jenisKombel ? "Pilih Jenis Kombel terlebih dahulu" : "-- Pilih Nama Kombel --"}
                            </option>
                            {formData.jenisKombel && [...new Set(NAMA_KOMBEL_MAPPING[formData.jenisKombel] || [])].map((nama, index) => (
                                <option key={`${nama}-${index}`} value={nama}>{nama}</option>
                            ))}
                        </select>
                    </div>

                    <div className="mt-8 border-t border-slate-200 pt-6">

                            <Users className="w-5 h-5 text-indigo-500" /> Data Pengurus
                        </h3>

                        <div className="bg-slate-50 p-4 rounded-lg border border-slate-200 mb-4 space-y-4">

                            <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                <div>
                                    <label className="block text-xs text-slate-500 mb-1">Nama Ketua</label>
                                    <input type="text" name="namaKetua" value={formData.namaKetua} onChange={handleInputChange} className="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:border-indigo-500 focus:outline-none" placeholder="Nama Lengkap" />
                                </div>
                                <div>
                                    <label className="block text-xs text-slate-500 mb-1">Instansi Ketua</label>
                                    <input type="text" name="instansiKetua" value={formData.instansiKetua} onChange={handleInputChange} className="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:border-indigo-500 focus:outline-none" placeholder="Asal Instansi" />

                                <div>
                                    <label className="block text-xs text-slate-500 mb-1">No HP/WA Ketua</label>

                                </div>

                                <h4 className="font-medium text-slate-700">Wakil Ketua Kombel</h4>
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                    <div>
                                        <label className="block text-xs text-slate-500 mb-1">Nama Wakil Ketua</label>
                                        <input type="text" name="namaWakilKetua" value={formData.namaWakilKetua} onChange={handleInputChange} className="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:border-indigo-500 focus:outline-none" placeholder="Nama Lengkap" />
                                    </div>
                                    <div>
                                        <label className="block text-xs text-slate-500 mb-1">Instansi Wakil Ketua</label>
                                        <input type="text" name="instansiWakilKetua" value={formData.instansiWakilKetua} onChange={handleInputChange} className="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:border-indigo-500 focus:outline-none" placeholder="Asal Instansi" />
                                    </div>
                                    <div>
                                        <label className="block text-xs text-slate-500 mb-1">No HP/WA Wakil Ketua</label>
                                        <input type="tel" name="noHpWakilKetua" value={formData.noHpWakilKetua} onChange={handleInputChange} className="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:border-indigo-500 focus:outline-none" placeholder="08..." />
                                    </div>
                                </div>
                            </div>

                                <div>
                                    <label className="block text-xs text-slate-500 mb-1">Nama Sekretaris</label>
                                    <input type="text" name="namaSekretaris" value={formData.namaSekretaris} onChange={handleInputChange} className="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:border-indigo-500 focus:outline-none" placeholder="Nama Lengkap" />

                                <div>

                                </div>
                                <div>
                                    <label className="block text-xs text-slate-500 mb-1">No HP/WA Sekretaris</label>
                                    <input type="tel" name="noHpSekretaris" value={formData.noHpSekretaris} onChange={handleInputChange} className="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:border-indigo-500 focus:outline-none" placeholder="08..." />
                                </div>
                            </div>
                        </div>

                        <div className="bg-slate-50 p-4 rounded-lg border border-slate-200 mb-4 space-y-4">
                            <h4 className="font-medium text-slate-700">Bendahara Kombel</h4>
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                <div>
                                    <label className="block text-xs text-slate-500 mb-1">Nama Bendahara</label>
                                    <input type="text" name="namaBendahara" value={formData.namaBendahara} onChange={handleInputChange} className="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:border-indigo-500 focus:outline-none" placeholder="Nama Lengkap" />
                                </div>
                                <div>
                                    <label className="block text-xs text-slate-500 mb-1">Instansi Bendahara</label>
                                    <input type="text" name="instansiBendahara" value={formData.instansiBendahara} onChange={handleInputChange} className="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:border-indigo-500 focus:outline-none" placeholder="Asal Instansi" />
                                </div>
                                <div>
                                    <label className="block text-xs text-slate-500 mb-1">No HP/WA Bendahara</label>
                                    <input type="tel" name="noHpBendahara" value={formData.noHpBendahara} onChange={handleInputChange} className="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:border-indigo-500 focus:outline-none" placeholder="08..." />
                                </div>
                            </div>

                                            <label className="block text-xs text-slate-500 mb-1">Nama</label>
                                            <input type="text" name="namaPendidikan" value={formData.namaPendidikan} onChange={handleInputChange} className="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:border-indigo-500 focus:outline-none" placeholder="Nama Lengkap" />
                                        </div>
                                        <div>
                                            <label className="block text-xs text-slate-500 mb-1">Instansi</label>
                                            <input type="text" name="instansiPendidikan" value={formData.instansiPendidikan} onChange={handleInputChange} className="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:border-indigo-500 focus:outline-none" placeholder="Asal Instansi" />
                                        </div>
                                        <div>
                                            <label className="block text-xs text-slate-500 mb-1">No HP/WA</label>
                                            <input type="tel" name="noHpPendidikan" value={formData.noHpPendidikan} onChange={handleInputChange} className="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:border-indigo-500 focus:outline-none" placeholder="08..." />
                                        </div>
                                    </div>
                                </div>

                                <div className="bg-slate-50 p-4 rounded-lg border border-slate-200 mb-4 space-y-4">
                                    <h4 className="font-medium text-slate-700">Bidang Perencanaan & Pelaksanaan Program</h4>
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                        <div>
                                            <label className="block text-xs text-slate-500 mb-1">Nama</label>
                                            <input type="text" name="namaPerencanaan" value={formData.namaPerencanaan} onChange={handleInputChange} className="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:border-indigo-500 focus:outline-none" placeholder="Nama Lengkap" />
                                        </div>
                                        <div>
                                            <label className="block text-xs text-slate-500 mb-1">Instansi</label>
                                            <input type="text" name="instansiPerencanaan" value={formData.instansiPerencanaan} onChange={handleInputChange} className="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:border-indigo-500 focus:outline-none" placeholder="Asal Instansi" />
                                        </div>
                                        <div>
                                            <label className="block text-xs text-slate-500 mb-1">No HP/WA</label>
                                            <input type="tel" name="noHpPerencanaan" value={formData.noHpPerencanaan} onChange={handleInputChange} className="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:border-indigo-500 focus:outline-none" placeholder="08..." />
                                        </div>
                                    </div>
                                </div>

                                <div className="bg-slate-50 p-4 rounded-lg border border-slate-200 mb-4 space-y-4">
                                    <h4 className="font-medium text-slate-700">Bidang Humas</h4>
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                        <div>
                                            <label className="block text-xs text-slate-500 mb-1">Nama</label>
                                            <input type="text" name="namaHumas" value={formData.namaHumas} onChange={handleInputChange} className="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:border-indigo-500 focus:outline-none" placeholder="Nama Lengkap" />
                                        </div>
                                        <div>
                                            <label className="block text-xs text-slate-500 mb-1">Instansi</label>
                                            <input type="text" name="instansiHumas" value={formData.instansiHumas} onChange={handleInputChange} className="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:border-indigo-500 focus:outline-none" placeholder="Asal Instansi" />
                                        </div>
                                        <div>
                                            <label className="block text-xs text-slate-500 mb-1">No HP/WA</label>
                                            <input type="tel" name="noHpHumas" value={formData.noHpHumas} onChange={handleInputChange} className="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:border-indigo-500 focus:outline-none" placeholder="08..." />
                                        </div>
                                    </div>
                                </div>

                                <div className="bg-slate-50 p-4 rounded-lg border border-slate-200 mb-4 space-y-4">
                                    <h4 className="font-medium text-slate-700">Bidang Dokumentasi / Publikasi</h4>
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                        <div>
                                            <label className="block text-xs text-slate-500 mb-1">Nama</label>
                                            <input type="text" name="namaDokumentasi" value={formData.namaDokumentasi} onChange={handleInputChange} className="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:border-indigo-500 focus:outline-none" placeholder="Nama Lengkap" />
                                        </div>
                                        <div>
                                            <label className="block text-xs text-slate-500 mb-1">Instansi</label>
                                            <input type="text" name="instansiDokumentasi" value={formData.instansiDokumentasi} onChange={handleInputChange} className="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:border-indigo-500 focus:outline-none" placeholder="Asal Instansi" />
                                        </div>
                                        <div>
                                            <label className="block text-xs text-slate-500 mb-1">No HP/WA</label>
                                            <input type="tel" name="noHpDokumentasi" value={formData.noHpDokumentasi} onChange={handleInputChange} className="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:border-indigo-500 focus:outline-none" placeholder="08..." />
                                        </div>
                                    </div>
                                </div>
                            </>
                        )}
                    </div>

                    <div className="bg-slate-50 p-4 rounded-lg border border-slate-200 mt-6">
                        <label className="block text-sm font-medium text-slate-700 mb-3">
                            Status SK Kombel <span className="text-red-500">*</span>
                        </label>
                        <div className="flex items-center gap-6 mb-4">
                            <label className="flex items-center gap-2 text-sm cursor-pointer">
                                <input type="radio" name="statusSK" value="sudah" checked={formData.statusSK === 'sudah'} onChange={handleInputChange} className="text-indigo-600 focus:ring-indigo-500" />
                                Sudah Ada SK
                            </label>
                            <label className="flex items-center gap-2 text-sm cursor-pointer">
                                <input type="radio" name="statusSK" value="belum" checked={formData.statusSK === 'belum'} onChange={handleInputChange} className="text-indigo-600 focus:ring-indigo-500" />
                                Belum Ada SK
                            </label>
                        </div>

                        {formData.statusSK === 'sudah' ? (
                            <div>
                                <label className="block text-sm font-medium text-slate-700 mb-1 flex items-center gap-2">
                                    Tautan (Link) SK Kombel
                                </label>
                                <div className="relative">
                                    <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                        <UploadCloud className="h-4 w-4 text-slate-400" />
                                    </div>
                                    <input 
                                        type="url" name="linkSK" value={formData.linkSK} onChange={handleInputChange} required={formData.statusSK === 'sudah'}
                                        placeholder="https://drive.google.com/..."
                                        className="w-full rounded-lg border border-slate-300 bg-white pl-10 pr-4 py-2.5 text-sm focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500 transition-colors"
                                    />
                                </div>
                                <p className="text-xs text-slate-500 mt-1">Pastikan link dapat diakses publik (misal: Google Drive yang sudah di-share).</p>
                            </div>
                        ) : (
                            <div className="p-3 bg-amber-50 border border-amber-200 rounded-md text-sm text-amber-800 flex items-start gap-2">
                                <AlertCircle className="w-5 h-5 shrink-0 text-amber-600" />
                                <p>Anda dapat mengunggah link SK Anda kembali pada fitur <b>"Upload Link SK"</b> di halaman <b>Data Hasil Isian</b> setelah Anda memiliki SK.</p>
                            </div>
                        )}
                    </div>

                    <div className="pt-4 border-t border-slate-100">
                        <button 
                            type="submit" disabled={submitting}
                            className="w-full flex justify-center items-center gap-2 py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 disabled:opacity-70 disabled:cursor-not-allowed transition-all"
                        >
                            {submitting ? 'Menyimpan...' : 'Kirim Data'}
                        </button>
                    </div>
                </form>
              </div>
            </div>
          );

          if (loading) {
              return (
                  <div className="min-h-screen bg-slate-50 flex items-center justify-center">
                      <div className="animate-pulse flex flex-col items-center">
                          <div className="w-12 h-12 bg-indigo-200 rounded-full mb-4"></div>
                          <div className="text-indigo-600 font-medium">Memuat Sistem Pendataan...</div>
                      </div>
                  </div>
              );
          }

          return (
            <div className="min-h-screen bg-slate-50 font-sans text-slate-900">
              {isLocalMode && (
                  <div className="bg-amber-50 text-amber-800 px-4 py-2.5 text-sm text-center font-medium border-b border-amber-200 flex justify-center items-center gap-2">
                      <AlertCircle className="w-4 h-4" />
                      Aplikasi berjalan dalam Mode Demo Lokal. Ganti konfigurasi Firebase di kode (baris ~65) untuk menyimpan data secara permanen.
                  </div>
              )}
              <header className="bg-white border-b border-slate-200 sticky top-0 z-10">
                <div className="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                  <div className="flex items-center gap-3">
                    <div className="bg-indigo-600 text-white p-2 rounded-lg"><Users className="w-5 h-5" /></div>
                    <div>
                        <h1 className="text-xl font-bold text-slate-800 leading-none">SiData Kombel</h1>
                        <p className="text-xs text-slate-500 mt-1">Sistem Pendataan Komunitas Belajar</p>
                    </div>
                  </div>
                </div>
              </header>

              <nav className="bg-white border-b border-slate-200 shadow-sm overflow-x-auto">
                <div className="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 flex space-x-8">
                    <button 
                        onClick={() => setActiveTab('dashboard')}
                        className={`py-4 px-1 border-b-2 font-medium text-sm flex items-center gap-2 whitespace-nowrap transition-colors ${
                            activeTab === 'dashboard' ? 'border-indigo-600 text-indigo-600' : 'border-transparent text-slate-500 hover:text-slate-700 hover:border-slate-300'
                        }`}
                    >
                        <LayoutDashboard className="w-4 h-4" /> Dasbor Statistik
                    </button>
                    <button 
                        onClick={() => setActiveTab('form')}
                        className={`py-4 px-1 border-b-2 font-medium text-sm flex items-center gap-2 whitespace-nowrap transition-colors ${
                            activeTab === 'form' ? 'border-indigo-600 text-indigo-600' : 'border-transparent text-slate-500 hover:text-slate-700 hover:border-slate-300'
                        }`}
                    >
                        <PlusCircle className="w-4 h-4" /> Isi Formulir
                    </button>
                    <button 
                        onClick={() => setActiveTab('data')}
                        className={`py-4 px-1 border-b-2 font-medium text-sm flex items-center gap-2 whitespace-nowrap transition-colors ${
                            activeTab === 'data' ? 'border-indigo-600 text-indigo-600' : 'border-transparent text-slate-500 hover:text-slate-700 hover:border-slate-300'
                        }`}
                    >
                        <Database className="w-4 h-4" /> Data Hasil Isian
                    </button>
                </div>
              </nav>

              <main className="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
                {activeTab === 'dashboard' && renderDashboard()}
                {activeTab === 'form' && renderForm()}
                {activeTab === 'data' && renderDataTab()}
              </main>
            </div>
          );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
